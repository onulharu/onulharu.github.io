<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>오늘하루 · onulharu</title>
  <meta name="description" content="오늘 막연히, 문득 하고 싶을 만한 것들의 목록. 오늘하루." />
  <meta property="og:title" content="오늘하루 · onulharu" />
  <meta property="og:description" content="오늘 막연히, 문득 하고 싶을 만한 것들의 목록." />
  <meta property="og:url" content="https://onulharu.com" />
  <meta property="og:type" content="website" />
  <link rel="canonical" href="https://onulharu.com" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☀️</text></svg>" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <style>
    :root {
      --bg: #fdfaf5;
      --text: #2b2b2b;
      --sub: #7a7468;
      --accent: #f2994a;
      --card: #ffffff;
      --line: #eee6da;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #1b1a18;
        --text: #f1ede6;
        --sub: #a39d92;
        --card: #252320;
        --line: #34312c;
      }
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 0 20px;
    }
    main { width: 100%; max-width: 640px; flex: 1; }
    header { padding: 96px 0 48px; text-align: center; }
    .sun { font-size: 56px; display: inline-block; animation: float 4s ease-in-out infinite; }
    @keyframes float { 50% { transform: translateY(-8px); } }
    h1 { font-size: 40px; font-weight: 800; letter-spacing: -0.03em; margin-top: 12px; }
    h1 small { display: block; font-size: 15px; font-weight: 500; color: var(--sub); letter-spacing: 0.1em; }
    .tagline { margin-top: 20px; font-size: 18px; color: var(--sub); }
    .tagline em { font-style: normal; color: var(--accent); font-weight: 700; }

    section { margin-bottom: 56px; }
    h2 { font-size: 14px; color: var(--sub); font-weight: 600; letter-spacing: 0.08em; margin-bottom: 16px; }

    .pick {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 20px;
      padding: 36px 28px;
      text-align: center;
    }
    .pick .emoji { font-size: 44px; }
    .pick .what { font-size: 22px; font-weight: 700; margin-top: 8px; min-height: 2em; }
    .pick button {
      margin-top: 20px;
      background: var(--accent);
      color: #fff;
      border: 0;
      border-radius: 999px;
      padding: 12px 28px;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: transform .15s;
    }
    .pick button:hover { transform: scale(1.04); }

    ul.list { list-style: none; display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 10px; }
    ul.list li {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 15px;
    }
    .about p { color: var(--sub); }
    .about p + p { margin-top: 10px; }

    footer { padding: 40px 0; font-size: 13px; color: var(--sub); text-align: center; }
    footer a { color: inherit; }
  </style>
</head>
<body>
  <main>
    <header>
      <div class="sun">☀️</div>
      <h1><small>ONULHARU</small>오늘하루</h1>
      <p class="tagline">오늘, <em>막연히</em>, <em>문득</em> 하고 싶어지는 것들</p>
    </header>

    <section>
      <h2>오늘의 하나</h2>
      <div class="pick">
        <div class="emoji" id="emoji">🌿</div>
        <div class="what" id="what">버튼을 눌러 오늘 할 일을 골라보세요</div>
        <button id="again" type="button">문득, 하나 뽑기</button>
      </div>
    </section>

    <section>
      <h2>이런 것들이 있어요</h2>
      <ul class="list" id="list"></ul>
    </section>

    <section class="about">
      <h2>오늘하루는</h2>
      <p>특별한 계획은 없지만 뭔가 하고 싶은 날이 있습니다. 그럴 때 가볍게 들여다볼 수 있는 목록을 모아두는 곳이에요.</p>
      <p>거창하지 않아도 괜찮아요. 오늘 하루를 조금 더 내 것으로 만들어 줄 작은 일들을 소개합니다.</p>
    </section>
  </main>

  <footer>
    © <span id="year"></span> 오늘하루 · <a href="https://onulharu.com">onulharu.com</a>
  </footer>

  <script>
    const ideas = [
      ["☕", "처음 가보는 카페에서 커피 한 잔"],
      ["🚶", "모르는 골목으로 30분 산책하기"],
      ["📚", "서점에서 제목만 보고 책 한 권 고르기"],
      ["🍳", "냉장고 속 재료로 새로운 요리 만들기"],
      ["🎬", "오래전 좋아했던 영화 다시 보기"],
      ["✍️", "오늘 있었던 일 세 줄 일기 쓰기"],
      ["🌅", "노을 지는 시간에 맞춰 밖에 나가기"],
      ["🎧", "안 들어본 장르의 음악 앨범 하나 듣기"],
      ["🧹", "방 한 구석만 깨끗하게 정리하기"],
      ["📮", "오랜만에 친구에게 먼저 연락하기"],
      ["🚌", "버스 종점까지 가보기"],
      ["🌱", "작은 화분 하나 들이기"],
      ["📷", "오늘의 하늘 사진 찍기"],
      ["🧘", "10분 동안 아무것도 안 하고 멍때리기"],
      ["🍦", "편의점 신상 아이스크림 먹어보기"],
      ["🎨", "낙서처럼 그림 하나 그려보기"]
    ];
    const list = document.getElementById("list");
    ideas.forEach(([e, t]) => {
      const li = document.createElement("li");
      li.textContent = `${e} ${t}`;
      list.appendChild(li);
    });
    let last = -1;
    document.getElementById("again").addEventListener("click", () => {
      let i;
      do { i = Math.floor(Math.random() * ideas.length); } while (i === last && ideas.length > 1);
      last = i;
      document.getElementById("emoji").textContent = ideas[i][0];
      document.getElementById("what").textContent = ideas[i][1];
    });
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
